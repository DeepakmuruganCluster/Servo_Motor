<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servo Sizing — Project Setup</title>
  <link rel="stylesheet" href="css/servo-app.css" />
</head>
<body>
  <header>
    <div class="brand">
      <div>
        <h1>Servo Sizing</h1>
        <p>Project setup and servo configuration.</p>
      </div>
    </div>
    <div class="nav-links">
      <a class="header-link" href="index.html">Home</a>
    </div>
  </header>

  <main>
    <div class="page-grid">
      <section class="card">
        <h2>Project Defaults</h2>
        <div class="field-grid">
          <div class="field-row">
            <label>Shifts per day
              <input data-key="project_shifts" type="number" step="1" />
            </label>
          </div>
          <div class="field-row">
            <label>Working hours per shift
              <input data-key="project_hours_shift" type="number" step="0.5" />
            </label>
          </div>
          <div class="field-row">
            <label>Working days per week
              <input data-key="project_days_week" type="number" step="1" />
            </label>
          </div>
          <div class="field-row">
            <label>Total cycle time (machine)
              <input data-key="project_total_cycle" type="number" step="0.1" />
            </label>
          </div>
          <div class="field-row">
            <label>Total operating time per cycle
              <input data-key="project_operating_time" type="number" step="0.1" />
            </label>
          </div>
          <div class="field-row">
            <label>Machine service life (yrs)
              <input data-key="project_service_life" type="number" step="1" />
            </label>
          </div>
          <div class="field-row">
            <label>Movement accuracy required (µm)
              <input data-key="project_accuracy" type="number" step="1" />
            </label>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Servo Workspace</h2>
        <div class="field-grid">
          <div class="field-row">
            <label>Add new servo
              <input id="new-servo-name" type="text" placeholder="e.g., OP10, OP20, OP30" />
            </label>
          </div>
          <div class="button-row">
            <button id="add-servo-button" type="button" class="button">Add servo</button>
            <button id="save-project-button" type="button" class="button secondary">Save project</button>
          </div>
          <div id="project-message" style="margin-top: 12px; font-size: 13px; color: #6b7280;"></div>
        </div>

        <h3 style="margin-top: 28px;">Configured servos</h3>
        <div id="servo-list" class="servo-list"></div>
      </section>
    </div>
  </main>

  <script src="js/project-launcher.js"></script>
</body>
</html>
