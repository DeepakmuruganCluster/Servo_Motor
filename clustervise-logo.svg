<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100">
  <!-- Hexagon icon -->
  <g>
    <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="#111111"/>
    <!-- 4-circle clover pattern, evenodd cuts out overlaps -->
    <clipPath id="hc">
      <polygon points="50,4 90,27 90,73 50,96 10,73 10,27"/>
    </clipPath>
    <g clip-path="url(#hc)" fill="white" fill-rule="evenodd">
      <!-- top circle -->
      <circle cx="50" cy="32" r="20"/>
      <!-- right circle -->
      <circle cx="68" cy="50" r="20"/>
      <!-- bottom circle -->
      <circle cx="50" cy="68" r="20"/>
      <!-- left circle -->
      <circle cx="32" cy="50" r="20"/>
    </g>
    <!-- Punch out center with evenodd trick via a compound path -->
    <path clip-path="url(#hc)" fill-rule="evenodd" fill="white"
      d="M50,12 a20,20 0 1,0 .001,0 Z
         M68,30 a20,20 0 1,0 .001,0 Z
         M68,70 a20,20 0 1,0 .001,0 Z
         M32,70 a20,20 0 1,0 .001,0 Z"
      opacity="0"/>
  </g>
  <!-- ClusterVise wordmark -->
  <text x="106" y="65" font-family="Inter,system-ui,-apple-system,sans-serif"
        font-size="40" font-weight="700" fill="#111111" letter-spacing="-0.5">ClusterVise</text>
</svg>
