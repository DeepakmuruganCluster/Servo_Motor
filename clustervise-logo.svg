<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100">
  <!-- Hexagon -->
  <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="#111111"/>
  <clipPath id="hc">
    <polygon points="50,4 90,27 90,73 50,96 10,73 10,27"/>
  </clipPath>
  <!-- 4-circle clover inside hex -->
  <g clip-path="url(#hc)" fill="white">
    <circle cx="50" cy="32" r="20"/>
    <circle cx="68" cy="50" r="20"/>
    <circle cx="50" cy="68" r="20"/>
    <circle cx="32" cy="50" r="20"/>
    <!-- punch-out centre -->
    <circle cx="50" cy="50" r="14" fill="#111111"/>
  </g>
  <!-- Wordmark -->
  <text x="108" y="66" font-family="Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="42" font-weight="700" fill="#111111" letter-spacing="-0.5">ClusterVise</text>
</svg>
